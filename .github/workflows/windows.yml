name: Windows build and tests

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DRIFELOVE_BUILD_TESTS=ON -DRIFELOVE_BUILD_DESKTOP=OFF
      - name: Build
        run: cmake --build build/ci
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
