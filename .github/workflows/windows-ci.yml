name: Windows core and native controls

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-native-controls:
    name: Windows x64 / GCC / CPU-only
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure core and native shell
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DRIFELOVE_ALLOW_DEPENDENCY_DOWNLOADS=ON
          -DRIFELOVE_BUILD_NATIVE_DESKTOP=ON
          -DRIFELOVE_BUILD_TESTS=ON
          -DRIFELOVE_BUILD_MEDIA=OFF
          -DRIFELOVE_BUILD_ONNX_CUDA=OFF
          -DRIFELOVE_BUILD_CLI=OFF
          -DRIFELOVE_BUILD_DESKTOP=OFF
      - name: Build
        run: cmake --build build/ci --parallel 4
      - name: Run CPU and native control tests
        run: ctest --test-dir build/ci --output-on-failure --parallel 2 -E '^CudaHardware\.'

  model-tool-contracts:
    name: Model-tool contracts / CPU only
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python for development tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install CPU-only test dependencies
        run: >-
          python -m pip install --only-binary=:all: numpy==2.2.6 onnxruntime==1.22.0 pytest==8.4.2
      - name: Test model-tool contracts without weights
        run: >-
          python -m pytest tests/model_validation/test_stdf_tiling.py
          tests/model_validation/test_stdf_tiling_reference.py
          tests/model_validation/test_stdf_local_pack.py
          tests/model_validation/test_stdf_real_luma_quality.py
          tests/model_validation/test_nafnet_video_quality.py
          tests/model_validation/test_automatic_detail_gpu_e2e.py -q

  release-site-model-channel:
    name: Release publishing / signed-model contracts
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release publisher and model distribution contracts
        run: npm run test --prefix release-site
